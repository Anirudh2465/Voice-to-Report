version: "3.9"

services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: vtr_backend
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./templates:/templates
    restart: unless-stopped
    networks:
      - vtr_net

  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: vtr_postgres
    environment:
      POSTGRES_DB: voice_to_report
      POSTGRES_USER: vtr_user
      POSTGRES_PASSWORD: vtr_pass_change_me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vtr_user -d voice_to_report"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vtr_net

  # ── Redis Cache & Queue ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vtr_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vtr_net

  # ── Nginx Reverse Proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: vtr_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - vtr_net
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  vtr_net:
    driver: bridge
